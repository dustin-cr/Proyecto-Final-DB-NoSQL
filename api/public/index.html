<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Análisis de Reseñas – Negocios</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Barra superior -->
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
      <span class="navbar-brand">Análisis de Reseñas · Grupo 8</span>
    </div>
  </nav>
<!-- ===================== REPORTES ===================== -->
    <div class="card shadow-sm mt-4 mb-5" id="seccionReportes">
      <div class="card-header d-flex flex-wrap align-items-center gap-2">
        <span class="fw-semibold me-auto">Reporte de análisis</span>
        <select class="form-select form-select-sm w-auto" id="selectNegocio">
          <option value="">Seleccione un negocio…</option>
        </select>
      </div>
      <div class="card-body" id="contenidoReporte">
        <p class="text-muted mb-0">Seleccione un negocio para ver su último reporte.</p>
      </div>
    </div>
  <main class="container">

    <!-- Mensajes de éxito o error -->
    <div id="mensaje"></div>

    <div class="row g-4">

      <!-- Formulario para agregar / editar -->
      <div class="col-lg-4">
        <div class="card shadow-sm">
          <div class="card-header fw-semibold" id="tituloFormulario">Agregar negocio</div>
          <div class="card-body">
            <form id="formNegocio">
              <input type="hidden" id="negocioId">

              <div class="mb-3">
                <label for="nombre" class="form-label">Nombre *</label>
                <input type="text" class="form-control" id="nombre" required maxlength="100">
              </div>

              <div class="mb-3">
                <label for="googleId" class="form-label">ID del perfil de Google *</label>
                <input type="text" class="form-control" id="googleId" required maxlength="50">
              </div>

              <div class="mb-3">
                <label for="direccion" class="form-label">Dirección</label>
                <input type="text" class="form-control" id="direccion" maxlength="200">
              </div>

              <div class="form-check mb-3">
                <input class="form-check-input" type="checkbox" id="activo" checked>
                <label class="form-check-label" for="activo">Activo</label>
              </div>

              <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary" id="btnGuardar">Guardar</button>
                <button type="button" class="btn btn-outline-secondary d-none" id="btnCancelar">Cancelar</button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- Tabla dinámica -->
      <div class="col-lg-8">
        <div class="card shadow-sm">
          <div class="card-header fw-semibold">Negocios registrados</div>
          <div class="card-body p-0">
            <div class="table-responsive">
              <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                  <tr>
                    <th>Nombre</th>
                    <th>Dirección</th>
                    <th class="text-center">Reseñas</th>
                    <th class="text-center">Promedio</th>
                    <th class="text-center">Estado</th>
                    <th class="text-end">Acciones</th>
                  </tr>
                </thead>
                <tbody id="tablaNegocios">
                  <tr><td colspan="6" class="text-center text-muted py-4">Cargando…</td></tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
